[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "olliebot"
version = "0.1.0"
description = "A modular async Twitch bot for emote pyramid play and Twitch Helix integration."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "twitchio>=3.1.0",
  "httpx>=0.25.0",
  "aiosqlite>=0.19.0",
  "python-dotenv>=1.0.0"
]
classifiers = [
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
keywords = ["twitch", "bot", "twitchio", "async", "pyramids"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0"
]

[project.scripts]
olliebot = "olliebot.__main__:main"

[project.urls]
"Repository" = "https://github.com/your-org/olliebot"

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["olliebot"]
